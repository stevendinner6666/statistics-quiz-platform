
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow｜學習測驗平台</title>
<style>
:root {
  --blue:#2563eb;
  --blue-light:#eff6ff;
  --green:#16a34a;
  --red:#dc2626;
  --text:#1e293b;
  --muted:#64748b;
  --border:#e2e8f0;
  --bg:#f8fafc;
  --white:#ffffff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,select { font:inherit; }
button { cursor:pointer; }
header {
  background:white;
  border-bottom:1px solid var(--border);
  padding:17px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.logo { font-size:23px; font-weight:800; color:var(--blue); }
.logo span { color:var(--text); }
.header-note { color:var(--muted); font-size:13px; }
.container {
  width:min(1050px,92%);
  margin:32px auto;
}
.card {
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
}
h1 { font-size:28px; margin:0 0 10px; }
h2 { font-size:20px; margin:0 0 16px; }
h3 { font-size:17px; }
p { line-height:1.7; }
.muted { color:var(--muted); }
.small { font-size:13px; }
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.stat {
  background:white;
  border:1px solid var(--border);
  padding:18px;
  border-radius:14px;
}
.stat strong { display:block; font-size:26px; margin-top:8px; }
.btn {
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
  transition:.15s;
}
.btn-primary { background:var(--blue); color:white; }
.btn-primary:hover { background:#1d4ed8; }
.btn-secondary { background:#f1f5f9; color:var(--text); }
.btn-danger { background:#fee2e2; color:#b91c1c; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
select {
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:white;
  margin:8px 0 16px;
}
label { font-weight:700; font-size:14px; }
.hidden { display:none !important; }
.progress {
  height:8px;
  background:#e2e8f0;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}
.progress-bar {
  height:100%;
  background:var(--blue);
  transition:width .2s;
}
.quiz-layout {
  display:grid;
  grid-template-columns:minmax(0,1fr) 260px;
  gap:18px;
  align-items:start;
}
.question-title {
  font-size:20px;
  line-height:1.7;
  white-space:pre-wrap;
  margin:18px 0;
}
.option {
  display:flex;
  gap:12px;
  align-items:flex-start;
  width:100%;
  text-align:left;
  padding:15px;
  margin:10px 0;
  border:1px solid var(--border);
  border-radius:11px;
  background:white;
  line-height:1.6;
}
.option:hover { border-color:var(--blue); }
.option.selected {
  border:2px solid var(--blue);
  background:var(--blue-light);
}
.option-key {
  flex:none;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#f1f5f9;
  display:grid;
  place-items:center;
  font-weight:700;
}
.question-nav {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:14px 0;
}
.nav-number {
  border:1px solid var(--border);
  background:#f8fafc;
  border-radius:9px;
  min-height:39px;
  font-weight:700;
}
.nav-number.answered {
  background:#dcfce7;
  color:#166534;
  border-color:#86efac;
}
.nav-number.current {
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}
.legend {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  font-size:12px;
  color:var(--muted);
}
.legend span { display:flex; align-items:center; gap:5px; }
.dot { width:10px; height:10px; border-radius:3px; display:inline-block; }
.result-item {
  padding:16px 0;
  border-bottom:1px solid var(--border);
}
.result-item:last-child { border:0; }
.result-item.correct { border-left:4px solid var(--green); padding-left:13px; }
.result-item.wrong { border-left:4px solid var(--red); padding-left:13px; }
.result-item.unanswered { border-left:4px solid #94a3b8; padding-left:13px; }
.tag {
  display:inline-block;
  border-radius:20px;
  padding:4px 9px;
  font-size:12px;
  font-weight:700;
}
.tag-green { background:#dcfce7; color:#166534; }
.tag-red { background:#fee2e2; color:#991b1b; }
.tag-gray { background:#f1f5f9; color:#475569; }
hr { border:0; border-top:1px solid var(--border); margin:20px 0; }
@media(max-width:750px) {
  .quiz-layout { grid-template-columns:1fr; }
  .grid { grid-template-columns:1fr; }
  .container { margin:20px auto; }
  .card { padding:18px; }
  header { padding:15px 4%; }
}
</style>
</head>

<body>
<header>
  <div class="logo">StudyFlow<span> .</span></div>
  <div class="header-note">讓每一次練習，都成為進步</div>
</header>

<main class="container">

<!-- 首頁 -->
<section id="homePage">
  <div class="card">
    <h1>歡迎使用 StudyFlow</h1>
    <p class="muted">你的個人化學習與考試練習平台。</p>
    <div id="loadStatus" class="small muted">正在讀取題庫...</div>
  </div>

  <div class="grid">
    <div class="stat">
      <span class="muted small">題庫總題數</span>
      <strong id="totalQuestions">--</strong>
    </div>
    <div class="stat">
      <span class="muted small">累積測驗次數</span>
      <strong id="totalAttempts">0</strong>
    </div>
    <div class="stat">
      <span class="muted small">錯題收藏</span>
      <strong id="wrongCount">0</strong>
    </div>
  </div>

  <div class="card">
    <h2>開始練習</h2>
    <label for="subjectSelect">科目</label>
    <select id="subjectSelect">
      <option value="statistics">統計學</option>
    </select>

    <label for="chapterSelect">章節</label>
    <select id="chapterSelect">
      <option value="ch1">Ch1｜Data and Statistics</option>
    </select>

    <label for="questionCount">測驗題數</label>
    <select id="questionCount">
      <option value="10">10 題</option>
      <option value="20">20 題</option>
      <option value="50">50 題</option>
      <option value="all">全部題目</option>
    </select>

    <div id="resumeArea" class="hidden">
      <p class="muted">你有一份尚未完成的測驗，可以繼續作答。</p>
      <button class="btn btn-primary" onclick="resumeQuiz()">繼續上次測驗</button>
      <button class="btn btn-secondary" onclick="discardDraft()">放棄未完成測驗</button>
      <hr>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="startBtn" onclick="startQuiz()">開始測驗</button>
      <button class="btn btn-secondary" onclick="showWrongBook()">錯題本</button>
      <button class="btn btn-secondary" onclick="showHistory()">測驗紀錄</button>
    </div>
  </div>
</section>

<!-- 測驗頁 -->
<section id="quizPage" class="hidden">
  <div class="card">
    <div class="muted small" id="quizSubtitle">統計學 Ch1</div>
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px">
      <h2 id="questionCounter">第 1 題</h2>
      <span class="tag tag-green" id="answeredCounter">已作答 0 題</span>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="muted small" id="progressText"></div>
  </div>

  <div class="quiz-layout">
    <div class="card">
      <div class="muted small" id="questionId"></div>
      <div class="question-title" id="questionText"></div>
      <div id="optionsArea"></div>

      <div class="actions">
        <button class="btn btn-secondary" onclick="previousQuestion()">上一題</button>
        <button class="btn btn-secondary" onclick="nextQuestion()">下一題</button>
      </div>
      <p class="muted small">選擇答案後會自動暫存，交卷前都可以修改。</p>
    </div>

    <aside class="card">
      <h3>題號導覽</h3>
      <div class="legend">
        <span><i class="dot" style="background:#dcfce7"></i>已作答</span>
        <span><i class="dot" style="background:#2563eb"></i>目前題目</span>
        <span><i class="dot" style="background:#f1f5f9"></i>未作答</span>
      </div>
      <div class="question-nav" id="questionNav"></div>
      <hr>
      <div class="small muted" id="navSummary"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="submitQuiz()">交卷</button>
      <button class="btn btn-secondary" style="width:100%;margin-top:9px" onclick="backToHome()">暫時離開</button>
    </aside>
  </div>
</section>

<!-- 結果頁 -->
<section id="resultPage" class="hidden">
  <div class="card">
    <h1>測驗完成！</h1>
    <p class="muted">以下是本次測驗結果。</p>
    <div class="grid">
      <div class="stat">
        <span class="muted small">總分</span>
        <strong id="resultScore">0</strong>
      </div>
      <div class="stat">
        <span class="muted small">答對題數</span>
        <strong id="resultCorrect">0</strong>
      </div>
      <div class="stat">
        <span class="muted small">未作答</span>
        <strong id="resultUnanswered">0</strong>
      </div>
    </div>
    <p id="resultMessage"></p>
    <div class="actions">
      <button class="btn btn-primary" onclick="backToHome()">回首頁</button>
      <button class="btn btn-secondary" onclick="showWrongBook()">查看錯題本</button>
    </div>
  </div>

  <div class="card">
    <h2>本次答題檢討</h2>
    <div id="reviewArea"></div>
  </div>
</section>

<!-- 錯題本 -->
<section id="wrongPage" class="hidden">
  <div class="card">
    <h1>錯題本</h1>
    <p class="muted">整理你曾經答錯的題目。</p>
    <div id="wrongList"></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="startWrongQuiz()">重新練習錯題</button>
      <button class="btn btn-secondary" onclick="backToHome()">回首頁</button>
    </div>
  </div>
</section>

<!-- 歷史紀錄 -->
<section id="historyPage" class="hidden">
  <div class="card">
    <h1>測驗紀錄</h1>
    <p class="muted">查看過去的練習成績。</p>
    <div id="historyList"></div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="backToHome()">回首頁</button>
      <button class="btn btn-danger" onclick="clearHistory()">清除歷史紀錄</button>
    </div>
  </div>
</section>

</main>

<script>
const BANK_PATH = "./data/statistics/ch1.json";

const STORAGE = {
  draft: "studyflow_draft_v2",
  history: "studyflow_history_v2",
  wrong: "studyflow_wrong_v2"
};

let allQuestions = [];
let quizQuestions = [];
let answers = {};
let currentIndex = 0;
let wrongMode = false;
let quizFinished = false;

function readStorage(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}

function writeStorage(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function showPage(pageId) {
  ["homePage","quizPage","resultPage","wrongPage","historyPage"]
    .forEach(id => document.getElementById(id).classList.add("hidden"));
  document.getElementById(pageId).classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

async function loadQuestions() {
  const status = document.getElementById("loadStatus");
  try {
    const response = await fetch(BANK_PATH);
    if (!response.ok) throw new Error("無法讀取題庫，HTTP " + response.status);

    const data = await response.json();
    if (!Array.isArray(data.questions)) {
      throw new Error("題庫格式錯誤，找不到 questions");
    }

    allQuestions = data.questions.map((q,index) => ({
      ...q,
      id: q.id ?? index + 1
    }));

    document.getElementById("totalQuestions").textContent = allQuestions.length;
    status.textContent = "題庫讀取成功，可以開始測驗。";
    status.style.color = "#16a34a";

    updateDashboard();
    checkDraft();
  } catch(error) {
    status.textContent = "題庫讀取失敗：" + error.message;
    status.style.color = "#dc2626";
    document.getElementById("startBtn").disabled = true;
  }
}

function updateDashboard() {
  const history = readStorage(STORAGE.history, []);
  const wrong = readStorage(STORAGE.wrong, {});
  document.getElementById("totalAttempts").textContent = history.length;
  document.getElementById("wrongCount").textContent = Object.keys(wrong).length;
}

function checkDraft() {
  const draft = readStorage(STORAGE.draft, null);
  const area = document.getElementById("resumeArea");
  if (draft && Array.isArray(draft.questions) && draft.questions.length) {
    area.classList.remove("hidden");
  } else {
    area.classList.add("hidden");
  }
}

function makeQuestionKey(q) {
  return `${q.subject || "統計學"}_${q.chapter || "Ch1"}_${q.id}`;
}

function startQuiz() {
  if (!allQuestions.length) return alert("題庫尚未載入完成。");

  const countValue = document.getElementById("questionCount").value;
  const count = countValue === "all"
    ? allQuestions.length
    : Math.min(Number(countValue), allQuestions.length);

  quizQuestions = shuffle(allQuestions).slice(0,count);
  answers = {};
  currentIndex = 0;
  wrongMode = false;
  quizFinished = false;

  saveDraft();
  beginQuizDisplay();
}

function startWrongQuiz() {
  const wrong = Object.values(readStorage(STORAGE.wrong, {}));
  if (!wrong.length) return alert("目前沒有錯題可以練習。");

  quizQuestions = shuffle(wrong);
  answers = {};
  currentIndex = 0;
  wrongMode = true;
  quizFinished = false;

  saveDraft();
  beginQuizDisplay();
}

function resumeQuiz() {
  const draft = readStorage(STORAGE.draft, null);
  if (!draft || !Array.isArray(draft.questions)) {
    return alert("找不到未完成的測驗。");
  }

  quizQuestions = draft.questions;
  answers = draft.answers || {};
  currentIndex = Math.min(draft.currentIndex || 0, quizQuestions.length - 1);
  wrongMode = Boolean(draft.wrongMode);
  quizFinished = false;

  beginQuizDisplay();
}

function discardDraft() {
  if (!confirm("確定要放棄這份未完成的測驗嗎？")) return;
  localStorage.removeItem(STORAGE.draft);
  checkDraft();
}

function saveDraft() {
  if (quizFinished || !quizQuestions.length) return;

  writeStorage(STORAGE.draft, {
    questions: quizQuestions,
    answers,
    currentIndex,
    wrongMode,
    updatedAt: new Date().toISOString()
  });

  checkDraft();
}

function beginQuizDisplay() {
  showPage("quizPage");
  renderQuestion();
  renderQuestionNav();
}

function renderQuestion() {
  const q = quizQuestions[currentIndex];
  if (!q) return;

  document.getElementById("quizSubtitle").textContent =
    `${q.subject || "統計學"} ${q.chapter || "Ch1"}`;

  document.getElementById("questionCounter").textContent =
    `第 ${currentIndex + 1} 題 / 共 ${quizQuestions.length} 題`;

  document.getElementById("questionId").textContent =
    `題庫題號：${q.id}`;

  document.getElementById("questionText").textContent = q.question || "";

  const selected = answers[currentIndex];
  const optionsArea = document.getElementById("optionsArea");
  optionsArea.innerHTML = "";

  (q.options || []).forEach((option,index) => {
    const value = option.value ?? String.fromCharCode(65 + index);
    const label = option.label ?? option.text ?? "";

    const button = document.createElement("button");
    button.className = "option" + (selected === value ? " selected" : "");
    button.innerHTML = `
      <span class="option-key">${escapeHTML(value)}</span>
      <span>${escapeHTML(label)}</span>
    `;
    button.onclick = () => selectAnswer(value);
    optionsArea.appendChild(button);
  });

  updateProgress();
}

function selectAnswer(value) {
  if (quizFinished) return;
  answers[currentIndex] = value;
  saveDraft();
  renderQuestion();
  renderQuestionNav();
}

function updateProgress() {
  const answered = Object.keys(answers).length;
  const total = quizQuestions.length;
  const percentage = total ? answered / total * 100 : 0;

  document.getElementById("progressBar").style.width = percentage + "%";
  document.getElementById("progressText").textContent =
    `目前已作答 ${answered} / ${total} 題`;

  document.getElementById("answeredCounter").textContent =
    `已作答 ${answered} 題`;
}

function renderQuestionNav() {
  const nav = document.getElementById("questionNav");
  nav.innerHTML = "";

  quizQuestions.forEach((q,index) => {
    const button = document.createElement("button");
    button.className = "nav-number";

    if (answers[index] !== undefined) button.classList.add("answered");
    if (index === currentIndex) button.classList.add("current");

    button.textContent = index + 1;
    button.title = answers[index] !== undefined ? "已作答" : "尚未作答";
    button.onclick = () => goToQuestion(index);

    nav.appendChild(button);
  });

  const answered = Object.keys(answers).length;
  const unanswered = quizQuestions.length - answered;
  document.getElementById("navSummary").textContent =
    `已作答：${answered} 題｜未作答：${unanswered} 題`;
}

function goToQuestion(index) {
  if (index < 0 || index >= quizQuestions.length) return;
  currentIndex = index;
  saveDraft();
  renderQuestion();
  renderQuestionNav();
}

function previousQuestion() {
  if (currentIndex > 0) goToQuestion(currentIndex - 1);
}

function nextQuestion() {
  if (currentIndex < quizQuestions.length - 1) {
    goToQuestion(currentIndex + 1);
  }
}

function submitQuiz() {
  const answered = Object.keys(answers).length;
  const unanswered = quizQuestions.length - answered;

  let message = `已作答 ${answered} 題，尚有 ${unanswered} 題未作答。`;
  if (!confirm(message + "\n確定要交卷並統一批改嗎？")) return;

  finishQuiz();
}

function finishQuiz() {
  quizFinished = true;

  let correct = 0;
  let unanswered = 0;

  const results = quizQuestions.map((q,index) => {
    const userAnswer = answers[index];
    const answer = String(q.answer ?? "").trim().toUpperCase();
    const selected = userAnswer === undefined
      ? null
      : String(userAnswer).trim().toUpperCase();

    const isUnanswered = selected === null;
    const isCorrect = !isUnanswered && selected === answer;

    if (isUnanswered) unanswered++;
    if (isCorrect) correct++;

    return {
      question:q,
      userAnswer:selected,
      correctAnswer:answer,
      isCorrect,
      isUnanswered
    };
  });

  const total = quizQuestions.length;
  const score = total ? Math.round(correct / total * 100) : 0;

  saveWrongAnswers(results);

  const history = readStorage(STORAGE.history, []);
  history.unshift({
    date:new Date().toLocaleString("zh-TW"),
    total,
    correct,
    unanswered,
    score,
    wrongMode
  });
  writeStorage(STORAGE.history, history.slice(0,100));

  localStorage.removeItem(STORAGE.draft);

  document.getElementById("resultScore").textContent = score + " 分";
  document.getElementById("resultCorrect").textContent =
    `${correct} / ${total}`;
  document.getElementById("resultUnanswered").textContent = unanswered;
  document.getElementById("resultMessage").textContent =
    score >= 90 ? "表現非常好，繼續保持！" :
    score >= 60 ? "已經有不錯的基礎，再多練習幾次！" :
    "別氣餒，檢討錯題後再挑戰一次！";

  renderReview(results);
  updateDashboard();
  showPage("resultPage");
}

function saveWrongAnswers(results) {
  const wrong = readStorage(STORAGE.wrong, {});

  results.forEach(result => {
    const q = result.question;
    const key = makeQuestionKey(q);

    if (result.isCorrect) {
      delete wrong[key];
    } else {
      wrong[key] = q;
    }
  });

  writeStorage(STORAGE.wrong, wrong);
}

function renderReview(results) {
  const area = document.getElementById("reviewArea");
  area.innerHTML = "";

  results.forEach((result,index) => {
    const q = result.question;
    const item = document.createElement("div");
    item.className = "result-item " +
      (result.isCorrect ? "correct" :
       result.isUnanswered ? "unanswered" : "wrong");

    const status = result.isCorrect
      ? '<span class="tag tag-green">答對</span>'
      : result.isUnanswered
        ? '<span class="tag tag-gray">未作答</span>'
        : '<span class="tag tag-red">答錯</span>';

    const optionsText = (q.options || []).map(option =>
      `${option.value}. ${option.label}`
    ).join("<br>");

    item.innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px">
        <strong>第 ${index + 1} 題</strong>${status}
      </div>
      <p>${escapeHTML(q.question)}</p>
      <div class="small muted">${optionsText}</div>
      <p class="small">你的答案：${escapeHTML(result.userAnswer ?? "未作答")}</p>
      <p class="small">正確答案：<strong style="color:#16a34a">${escapeHTML(result.correctAnswer)}</strong></p>
      <p class="small">解析：${escapeHTML(q.explanation || "原始題庫未提供解析。")}</p>
    `;

    area.appendChild(item);
  });
}

function showWrongBook() {
  const wrong = Object.values(readStorage(STORAGE.wrong, {}));
  const area = document.getElementById("wrongList");
  area.innerHTML = "";

  if (!wrong.length) {
    area.innerHTML = '<p class="muted">目前還沒有錯題，繼續加油！</p>';
  } else {
    wrong.forEach((q,index) => {
      const item = document.createElement("div");
      item.className = "result-item";
      item.innerHTML = `
        <strong>錯題 ${index + 1}｜題庫題號 ${escapeHTML(q.id)}</strong>
        <p>${escapeHTML(q.question)}</p>
        <p class="small muted">
          正確答案：${escapeHTML(q.answer)}
        </p>
        <p class="small">解析：${escapeHTML(q.explanation || "原始題庫未提供解析。")}</p>
      `;
      area.appendChild(item);
    });
  }

  const button = document.querySelector("#wrongPage .btn-primary");
  button.disabled = wrong.length === 0;

  showPage("wrongPage");
}

function showHistory() {
  const history = readStorage(STORAGE.history, []);
  const area = document.getElementById("historyList");
  area.innerHTML = "";

  if (!history.length) {
    area.innerHTML = '<p class="muted">目前沒有測驗紀錄。</p>';
  } else {
    history.forEach((record,index) => {
      const item = document.createElement("div");
      item.className = "result-item";
      item.innerHTML = `
        <strong>第 ${history.length - index} 次測驗</strong>
        <p class="small muted">${escapeHTML(record.date)}</p>
        <p>分數：<strong>${record.score} 分</strong></p>
        <p class="small muted">
          答對 ${record.correct} 題／共 ${record.total} 題，
          未作答 ${record.unanswered} 題
        </p>
      `;
      area.appendChild(item);
    });
  }

  showPage("historyPage");
}

function clearHistory() {
  if (!confirm("確定要清除所有測驗紀錄嗎？")) return;
  localStorage.removeItem(STORAGE.history);
  updateDashboard();
  showHistory();
}

  updateDashboard();
  checkDraft();
  showPage("homePage");
}
