
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow｜線上題庫練習</title>
<style>
:root {
  --ink:#202124;
  --muted:#777b84;
  --line:#e8e9ed;
  --bg:#f7f8fa;
  --blue:#315efb;
  --green:#168653;
  --red:#d94343;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--ink);
}
header {
  background:white;
  border-bottom:1px solid var(--line);
  padding:17px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo { font-size:21px; font-weight:800; }
.logo span { color:var(--blue); }
header small { color:var(--muted); }
main { max-width:920px; margin:35px auto; padding:0 20px 60px; }
h1 { font-size:29px; margin-bottom:8px; }
.subtitle { color:var(--muted); margin-bottom:28px; }
.card {
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 3px 14px #00000005;
}
.card h2 { margin:0 0 17px; font-size:19px; }
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.stat {
  background:#f7f8fc;
  border-radius:12px;
  padding:17px;
}
.stat strong { display:block; font-size:25px; margin-bottom:5px; }
.stat span { color:var(--muted); font-size:13px; }
button,select {
  font:inherit;
  border-radius:9px;
  padding:12px 15px;
}
button {
  border:0;
  cursor:pointer;
  background:var(--blue);
  color:white;
  font-weight:650;
}
button:disabled { opacity:.45; cursor:not-allowed; }
button.secondary {
  background:white;
  color:var(--ink);
  border:1px solid var(--line);
}
button.danger { background:#fff0f0; color:var(--red); }
select {
  border:1px solid var(--line);
  background:white;
  width:100%;
  margin:8px 0 15px;
}
label { display:block; font-weight:600; margin-top:12px; }
.actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
.option {
  display:block;
  width:100%;
  text-align:left;
  background:white;
  color:var(--ink);
  border:1px solid var(--line);
  margin:10px 0;
  padding:15px;
  line-height:1.55;
  font-weight:400;
}
.option:hover:not(:disabled) { border-color:var(--blue); }
.option.selected {
  border:2px solid var(--blue);
  background:#f2f5ff;
}
.option.correct {
  border:2px solid var(--green);
  background:#edfaf3;
}
.option.incorrect {
  border:2px solid var(--red);
  background:#fff1f1;
}
.option:disabled { cursor:default; opacity:1; }
.question-meta { color:var(--muted); font-size:14px; margin-bottom:15px; }
.question-text { font-size:19px; line-height:1.7; font-weight:650; }
.progress {
  height:7px;
  background:#eceef2;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0 22px;
}
.progress div {
  height:100%;
  background:var(--blue);
  transition:.2s;
}
.feedback {
  padding:14px;
  border-radius:10px;
  margin-top:15px;
  line-height:1.7;
}
.feedback.good { background:#edfaf3; color:var(--green); }
.feedback.bad { background:#fff1f1; color:var(--red); }
.hidden { display:none !important; }
.muted { color:var(--muted); font-size:14px; }
.review-item { border-top:1px solid var(--line); padding:17px 0; }
.review-item p { line-height:1.6; }
footer { text-align:center; color:var(--muted); padding:25px; font-size:13px; }
@media(max-width:600px) {
  main { margin-top:22px; }
  .card { padding:19px; }
  .stats { gap:7px; }
  .stat { padding:12px; }
  .stat strong { font-size:21px; }
  h1 { font-size:25px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">Study<span>Flow</span></div>
  <small>讓每一次練習，都成為進步</small>
</header>

<main>

<section id="home">
  <h1>開始你的學習</h1>
  <p class="subtitle">選擇科目與題數，開始一場練習。</p>

  <div class="stats">
    <div class="stat">
      <strong id="totalQuestions">載入中</strong>
      <span>題庫總題數</span>
    </div>
    <div class="stat">
      <strong id="totalHistory">0</strong>
      <span>完成測驗次數</span>
    </div>
    <div class="stat">
      <strong id="averageScore">0%</strong>
      <span>平均正確率</span>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <h2>選擇測驗內容</h2>

    <label>科目</label>
    <select id="subjectSelect">
      <option value="統計學">統計學</option>
    </select>

    <label>章節</label>
    <select id="chapterSelect">
      <option value="Ch1">Ch1</option>
    </select>

    <label>測驗題數</label>
    <select id="countSelect">
      <option value="10">10 題</option>
      <option value="20">20 題</option>
      <option value="50">50 題</option>
      <option value="all">全部題目</option>
    </select>

    <p class="muted" id="availableText">正在讀取題庫……</p>

    <div class="actions">
      <button id="startBtn" onclick="startQuiz()" disabled>開始測驗</button>
      <button class="secondary" onclick="showWrongBook()">查看錯題本</button>
      <button class="secondary" onclick="showHistory()">測驗紀錄</button>
    </div>

    <p id="loadMessage" class="muted"></p>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="card">
    <div class="question-meta" id="questionMeta"></div>

    <div class="progress">
      <div id="progressBar" style="width:0%"></div>
    </div>

    <div class="question-text" id="questionText"></div>
    <div id="options"></div>

    <p class="muted" id="selectionHint">
      請選擇一個答案，確認前可以重新選擇。
    </p>

    <div class="actions">
      <button id="confirmBtn" onclick="confirmAnswer()" disabled>
        確認答案
      </button>
      <button id="nextBtn" onclick="nextQuestion()" disabled>
        下一題
      </button>
      <button class="secondary" onclick="finishEarly()">
        結束測驗
      </button>
    </div>

    <div id="feedback"></div>
  </div>
</section>

<section id="result" class="hidden">
  <h1>測驗完成！</h1>
  <p class="subtitle">以下是這次的測驗結果。</p>

  <div class="card">
    <div class="stats">
      <div class="stat">
        <strong id="resultScore">0</strong>
        <span>答對題數</span>
      </div>
      <div class="stat">
        <strong id="resultWrong">0</strong>
        <span>答錯題數</span>
      </div>
      <div class="stat">
        <strong id="resultRate">0%</strong>
        <span>正確率</span>
      </div>
    </div>

    <p id="unansweredSummary" class="muted"></p>

    <div class="actions">
      <button onclick="showReview()">查看答案與檢討</button>
      <button class="secondary" onclick="goHome()">回到首頁</button>
    </div>
  </div>

  <div id="review" class="card hidden">
    <h2>完整答案檢討</h2>
    <div id="reviewList"></div>
  </div>
</section>

<section id="wrongPage" class="hidden">
  <h1>錯題本</h1>
  <p class="subtitle">整理曾經答錯的題目，方便再次練習。</p>

  <div class="card">
    <div id="wrongList"></div>
    <div class="actions">
      <button onclick="startWrongQuiz()">重新練習錯題</button>
      <button class="secondary" onclick="goHome()">回到首頁</button>
      <button class="danger" onclick="clearWrongBook()">清空錯題本</button>
    </div>
  </div>
</section>

<section id="historyPage" class="hidden">
  <h1>測驗紀錄</h1>
  <p class="subtitle">查看過去的練習成果。</p>

  <div class="card">
    <div id="historyList"></div>
    <div class="actions">
      <button class="secondary" onclick="goHome()">回到首頁</button>
    </div>
  </div>
</section>

</main>

<footer>StudyFlow · Personal Learning Platform</footer>

<script>
const BANK_URL = "./data/statistics/ch1.json";

let bank = [];
let quizQuestions = [];
let currentIndex = 0;
let answers = [];
let lastResults = [];
let wrongMode = false;

// 暫存目前選取的答案，不立即判分
let selectedAnswer = null;

const $ = id => document.getElementById(id);

function getStorage(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function saveStorage(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function showPage(id) {
  ["home","quiz","result","wrongPage","historyPage"].forEach(page => {
    $(page).classList.toggle("hidden", page !== id);
  });
}

async function loadBank() {
  try {
    const response = await fetch(BANK_URL, {
      cache:"no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.questions)) {
      throw new Error("題庫格式不正確");
    }

    bank = data.questions.filter(q =>
      q.question &&
      Array.isArray(q.options) &&
      q.answer
    );

    $("totalQuestions").textContent = bank.length;
    $("availableText").textContent =
      `目前共有 ${bank.length} 題可供練習。`;

    $("loadMessage").textContent = "題庫載入成功！";
    $("startBtn").disabled = bank.length === 0;

    updateDashboard();

  } catch (error) {
    $("totalQuestions").textContent = "載入失敗";
    $("availableText").textContent = "目前無法讀取題庫。";
    $("loadMessage").textContent =
      "錯誤：" + error.message +
      "。請確認 ch1.json 位於 data/statistics/ 資料夾。";
  }
}

function updateDashboard() {
  const history = getStorage("studyflow_history", []);

  $("totalHistory").textContent = history.length;

  const average = history.length
    ? Math.round(
        history.reduce((sum, item) => sum + item.rate, 0) /
        history.length
      )
    : 0;

  $("averageScore").textContent = average + "%";
}

function startQuiz() {
  if (!bank.length) return;

  const countValue = $("countSelect").value;

  const count = countValue === "all"
    ? bank.length
    : Math.min(Number(countValue), bank.length);

  quizQuestions = shuffle(bank).slice(0, count);

  beginAttempt();
}

function beginAttempt() {
  currentIndex = 0;
  answers = [];
  lastResults = [];
  wrongMode = false;

  showPage("quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = quizQuestions[currentIndex];

  selectedAnswer = null;

  $("questionMeta").textContent =
    `統計學 · Ch1 ｜ 第 ${currentIndex + 1} / ${quizQuestions.length} 題`;

  $("progressBar").style.width =
    ((currentIndex + 1) / quizQuestions.length * 100) + "%";

  $("questionText").textContent = q.question;
  $("feedback").innerHTML = "";

  $("confirmBtn").disabled = true;
  $("confirmBtn").classList.remove("hidden");

  $("nextBtn").disabled = true;

  $("nextBtn").textContent =
    currentIndex === quizQuestions.length - 1
      ? "查看測驗結果"
      : "下一題";

  $("selectionHint").textContent =
    "請選擇一個答案，確認前可以重新選擇。";

  const options = $("options");
  options.innerHTML = "";

  q.options.forEach(option => {
    const button = document.createElement("button");

    button.className = "option";
    button.textContent = `${option.value}. ${option.label}`;

    button.onclick = () => selectAnswer(option.value);

    options.appendChild(button);
  });
}

// 第一次點擊只選取答案
function selectAnswer(value) {
  if (answers[currentIndex]) return;

  selectedAnswer = value;

  const q = quizQuestions[currentIndex];
  const buttons = [...$("options").children];

  buttons.forEach((button, index) => {
    const option = q.options[index];

    button.classList.toggle(
      "selected",
      option.value === selectedAnswer
    );
  });

  $("confirmBtn").disabled = false;

  $("selectionHint").textContent =
    `目前選擇：${value}。確認前仍可更改答案。`;
}

// 按下確認答案後才正式判分
function confirmAnswer() {
  if (selectedAnswer === null) return;
  if (answers[currentIndex]) return;

  const q = quizQuestions[currentIndex];

  const correct = String(q.answer).trim().toUpperCase();
  const isCorrect = selectedAnswer === correct;

  answers[currentIndex] = {
    question:q,
    selected:selectedAnswer,
    correct,
    isCorrect
  };

  const buttons = [...$("options").children];

  buttons.forEach((button, index) => {
    const option = q.options[index];

    button.disabled = true;
    button.classList.remove("selected");

    if (option.value === correct) {
      button.classList.add("correct");
    }

    if (option.value === selectedAnswer && !isCorrect) {
      button.classList.add("incorrect");
    }
  });

  $("confirmBtn").disabled = true;
  $("confirmBtn").classList.add("hidden");

  $("selectionHint").textContent = "答案已確認。";

  $("feedback").innerHTML = `
    <div class="feedback ${isCorrect ? "good" : "bad"}">
      ${isCorrect ? "答對了！" : "答錯了！"}
      <br>
      正確答案：${correct}
      <br>
      解析：${q.explanation || "原始題庫未提供解析。"}
    </div>
  `;

  if (!isCorrect) {
    addWrongQuestion(q);
  }

  $("nextBtn").disabled = false;
}

function nextQuestion() {
  if (!answers[currentIndex]) return;

  if (currentIndex < quizQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz(false);
  }
}

function finishEarly() {
  const confirmed = confirm(
    "確定要提前結束測驗嗎？\n結束後會顯示全部題目的答案與解析。"
  );

  if (confirmed) {
    finishQuiz(true);
  }
}

function finishQuiz(early = false) {
  lastResults = quizQuestions.map((q, index) => {
    const answer = answers[index];
    const correct = String(q.answer).trim().toUpperCase();

    return {
      question:q,
      selected:answer?.selected ?? null,
      correct,
      isCorrect:answer ? answer.isCorrect : false,
      unanswered:!answer
    };
  });

  const answered = lastResults.filter(a => !a.unanswered);
  const correctCount = answered.filter(a => a.isCorrect).length;
  const wrongCount = answered.filter(a => !a.isCorrect).length;
  const unansweredCount = lastResults.filter(a => a.unanswered).length;

  const rate = answered.length
    ? Math.round(correctCount / answered.length * 100)
    : 0;

  $("resultScore").textContent = correctCount;
  $("resultWrong").textContent = wrongCount;
  $("resultRate").textContent = rate + "%";

  $("unansweredSummary").textContent =
    `總題數：${quizQuestions.length}｜已作答：${answered.length}｜未作答：${unansweredCount}`;

  $("result").querySelector(".subtitle").textContent =
    early
      ? "已提前結束，你仍然可以檢視全部題目的答案與解析。"
      : "以下是這次的測驗結果。";

  if (!wrongMode) {
    const history = getStorage("studyflow_history", []);

    history.unshift({
      date:new Date().toLocaleString("zh-TW"),
      total:quizQuestions.length,
      answered:answered.length,
      correct:correctCount,
      rate,
      early
    });

    saveStorage("studyflow_history", history.slice(0,100));
  }

  updateDashboard();

  $("review").classList.add("hidden");
  showPage("result");
}

function showReview() {
  const list = $("reviewList");
  list.innerHTML = "";

  lastResults.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "review-item";

    const title = document.createElement("strong");
    title.textContent =
      `第 ${index + 1} 題：${item.question.question}`;

    div.appendChild(title);

    const status = document.createElement("p");

    if (item.unanswered) {
      status.textContent =
        `未作答｜正確答案：${item.correct}`;
      status.style.color = "var(--muted)";
    } else if (item.isCorrect) {
      status.textContent =
        `你的答案：${item.selected}（答對）`;
      status.style.color = "var(--green)";
    } else {
      status.textContent =
        `你的答案：${item.selected}；正確答案：${item.correct}`;
      status.style.color = "var(--red)";
    }

    div.appendChild(status);

    const explanation = document.createElement("p");
    explanation.className = "muted";
    explanation.textContent =
      item.question.explanation || "原始題庫未提供解析。";

    div.appendChild(explanation);
    list.appendChild(div);
  });

  $("review").classList.remove("hidden");
}

function questionKey(q) {
  return `${q.subject || "統計學"}-${q.chapter || "Ch1"}-${q.id}`;
}

function addWrongQuestion(q) {
  const wrong = getStorage("studyflow_wrong", []);
  const key = questionKey(q);

  if (!wrong.some(item => questionKey(item) === key)) {
    wrong.push(q);
    saveStorage("studyflow_wrong", wrong);
  }
}

function showWrongBook() {
  const wrong = getStorage("studyflow_wrong", []);
  const list = $("wrongList");

  list.innerHTML = "";

  if (!wrong.length) {
    list.textContent = "目前還沒有錯題，繼續保持！";
  } else {
    wrong.forEach((q, index) => {
      const div = document.createElement("div");
      div.className = "review-item";

      const title = document.createElement("strong");
      title.textContent = `${index + 1}. ${q.question}`;

      const answer = document.createElement("p");
      answer.className = "muted";
      answer.textContent = `正確答案：${q.answer}`;

      div.append(title, answer);
      list.appendChild(div);
    });
  }

  showPage("wrongPage");
}

function startWrongQuiz() {
  const wrong = getStorage("studyflow_wrong", []);

  if (!wrong.length) {
    alert("目前沒有錯題可以練習！");
    return;
  }

  quizQuestions = shuffle(wrong);
  beginAttempt();
  wrongMode = true;
}

function clearWrongBook() {
  if (confirm("確定要清空所有錯題嗎？")) {
    saveStorage("studyflow_wrong", []);
    showWrongBook();
  }
}

function showHistory() {
  const history = getStorage("studyflow_history", []);
  const list = $("historyList");

  list.innerHTML = "";

  if (!history.length) {
    list.textContent = "目前還沒有測驗紀錄。";
  } else {
    history.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "review-item";

      div.textContent =
        `${index + 1}. ${item.date}｜` +
        `${item.correct}/${item.answered ?? item.total} 題答對｜` +
        `正確率 ${item.rate}%` +
        (item.early ? "｜提前結束" : "");

      list.appendChild(div);
    });
  }

  showPage("historyPage");
}

function goHome() {
  showPage("home");
}

loadBank();
</script>
</body>
</html>
